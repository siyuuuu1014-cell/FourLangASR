plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.fourlangasr'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.fourlangasr"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "0.1"

        // Prototype: only modern 64-bit Android phones.
        // Add 'x86_64' here if you want to use an emulator.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // ASR models are already compressed/binary. Keeping them uncompressed
    // avoids extra work and is friendly to native model loading.
    aaptOptions {
        noCompress "onnx", "mdl", "fst", "conf", "txt", "bin", "arpa", "model"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // sherpa-onnx Android AAR.
    // tools/download_sherpa_aar.ps1 downloads this file.
    implementation files('libs/sherpa-onnx-1.13.7.aar')

    // Russian Vosk fallback/current candidate.
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
}
