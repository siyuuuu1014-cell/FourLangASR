plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.fourlangasr'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.fourlangasr"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "0.1"

        // Prototype: only modern 64-bit Android phones.
        // Add 'x86_64' here if you want to use an emulator.
        ndk {
            abiFilters 'arm64-v8a'
        }

        // 真机端到端管线测试（喂 WAV 进真实引擎）。
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        // 内容级调试日志（用户语音/译文）必须靠 BuildConfig.DEBUG 只在 debug 构建输出。
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    sourceSets {
        test {
            // JVM 单测直接读取主 assets（m2m100/tokenizer.bin）
            resources.srcDir 'src/main/assets'
        }
    }

    // ASR models are already compressed/binary. Keeping them uncompressed
    // avoids extra work and is friendly to native model loading.
    aaptOptions {
        noCompress "onnx", "mdl", "fst", "conf", "txt", "bin", "arpa", "model"
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    // JVM 单测解析对拍向量 JSON
    testImplementation 'org.json:json:20231013'

    // 真机管线测试：加载真实模型 + 真实 WAV。
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    /*
     * 阶段1 B 路线：官方 ppocr-sdk 后处理用到 OpenCV 的 Java 绑定。
     * 刻意只进 androidTest —— 生产 APK 与 jniLibs 组合保持原样。
     *
     * 依赖选型（真机实测得出，不是猜的）：
     * 官方 SDK 用的 com.quickbirdstudios:opencv:4.5.3 在本机 OPPO PLW110/Android 16 上
     * dlopen 失败：`cannot locate symbol "__sfp_handle_exceptions"`。
     * 解析 ELF 后确认是该 AAR 自身的打包缺陷：它的 libopencv_java4.so 把这个符号
     * 当 UNDEF 导入，而它自带的 libc++_shared.so 只在 .symtab 里定义、
     * 没有导出到 .dynsym，运行时无法解析。
     * 换成 OpenCV 官方在 Maven Central 发布的 org.opencv:opencv（4.9+ 用新 NDK 构建，
     * 已不再引用该符号），加载即通过。
     */
    androidTestImplementation 'org.opencv:opencv:4.11.0'
    // VoxLingua LID runtime. Java Interpreter API; compatible with Kotlin 1.9 project.
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    // VoxLingua107 LID runtime; separate from sherpa ONNX Runtime.
implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // sherpa-onnx Android AAR.
    // tools/download_sherpa_aar.ps1 downloads this file.
    implementation files('libs/sherpa-onnx-1.13.7.aar')

    // ORT Java bridge (1.27.0 classes.jar + libonnxruntime4j_jni.so).
    // libonnxruntime.so is reused from sherpa-onnx 1.13.7's bundled 1.27.1 build.
    implementation files('libs/onnxruntime-1.27.0-classes.jar')

    // Russian Vosk fallback/current candidate.
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
}
